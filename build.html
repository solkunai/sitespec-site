<!doctype html>
<html lang="en-GB"><head>
<script src="/gate.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build your kit | SITESPEC</title>
<link rel="icon" href="img/favicon.png">
<link rel="canonical" href="https://sitespecworkwear.com/build.html">
<meta name="description" content="Build your SITESPEC kit: dress the mannequin in liners, tops, jackets and joggers, spin it around and add the whole outfit to your cart.">
<meta property="og:type" content="website"><meta property="og:site_name" content="SITESPEC"><meta property="og:title" content="Build your kit | SITESPEC"><meta property="og:description" content="Dress the mannequin, spin it around and add your whole kit to the cart."><meta property="og:image" content="https://sitespecworkwear.com/img/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head><body>
<a class="skip" href="#main">Skip to content</a>
<div id="site-header"></div>
<main id="main">
<div class="page-head">
<h1>Build your kit</h1>
<p class="bk-sub">Pick a piece and it goes straight on. Drag the mannequin to spin it, then add your whole kit to the cart.</p>
</div>
<section class="bk">
<div class="bk-view">
<div class="bk-box" id="box">
<div class="bk-scene" id="scene" aria-label="Mannequin preview. Drag left or right to spin." role="img">
<div class="bk-stage" id="stage"><div class="bk-fig" id="fig"></div><div class="bk-floor"></div></div>
</div>
<div class="bk-hint" id="hint">Drag to spin</div>
</div>
<div class="bk-ctl" role="group" aria-label="Turn the mannequin">
<button type="button" data-a="0" class="on">Front</button>
<button type="button" data-a="40">3/4</button>
<button type="button" data-a="180">Back</button>
<button type="button" id="spinBtn" aria-pressed="false">Auto-spin</button>
<button type="button" id="clearBtn" class="ghost">Clear all</button>
</div>
<p class="bk-note">Turned views are illustrative. They show the shape of each piece from your product photos, not the exact rear details.</p>
</div>
<div class="bk-pick">
<div class="bk-tabs" id="tabs" role="tablist"></div>
<div class="bk-grid" id="items"></div>
<div class="bk-sum" id="sum"></div>
</div>
</section>
</main>
<div id="site-footer"></div>
<script src="site.js"></script>
<script>
document.addEventListener('sitespec:ready', function () {
  var S = window.SITESPEC, $ = function (s) { return document.querySelector(s); };
  var BUILD = 'img/build/';
  // slot: where it sits. w/h: size in stage pixels (stage is 400 x 860). y: top edge. x: centre. z: how far it sits from the body.
  var SLOTS = { legs: { label: 'Legs', z: 44, order: 1 }, top: { label: 'Tops', z: 54, order: 2 }, outer: { label: 'Jackets', z: 62, order: 3 }, neck: { label: 'Neck', z: 46, order: 4 }, head: { label: 'Head', z: 46, order: 5 } };
  var TABS = ['top', 'outer', 'legs', 'head', 'neck'];
  var G = {
    'polo-hi-vis-orange':       { slot: 'top', c: '#F26A1B',   w: 212, h: 278, y: 128 },
    'long-sleeve-hi-vis-orange':{ slot: 'top', c: '#F26A1B',   w: 262, h: 326, y: 132 },
    'quarter-zip-hi-vis-orange':{ slot: 'top', c: '#F26A1B',   w: 262, h: 326, y: 130 },
    'hi-vis-vest':              { slot: 'top', c: '#F26A1B',   w: 178, h: 296, y: 134 },
    'executive-shirt':          { slot: 'top', c: '#F26A1B',   w: 232, h: 318, y: 132 },
    'black-half-zip-hoodie':    { slot: 'top', c: '#14181F',   w: 214, h: 316, y: 110 },
    'black-crew-top':           { slot: 'top', c: '#14181F',   w: 262, h: 330, y: 132 },
    'oilskin-jacket':           { slot: 'outer', c: '#F26A1B', w: 262, h: 336, y: 126 },
    'oilskin-bodywarmer':       { slot: 'outer', c: '#F26A1B', w: 190, h: 318, y: 124 },
    'joggers-charcoal':         { slot: 'legs', c: '#2B3340',  w: 188, h: 388, y: 410 },
    'joggers-hi-vis-orange':    { slot: 'legs', c: '#F26A1B',  w: 182, h: 388, y: 410 },
    'black-cargo-joggers':      { slot: 'legs', c: '#14181F',  w: 182, h: 388, y: 410 },
    'skullcap-liner':           { slot: 'head', c: '#F26A1B',  w: 70,  h: 65,  y: 34 },
    'bobble-hat-orange':        { slot: 'head', c: '#F26A1B',  w: 80,  h: 102, y: -16 },
    'bobble-hat-charcoal':      { slot: 'head', c: '#2B3340',  w: 80,  h: 102, y: -16 },
    'neck-gaiter':              { slot: 'neck', c: '#F26A1B',  w: 70,  h: 92,  y: 98 }
  };
  var items = S.PRODUCTS.filter(function (p) { return G[p.slug]; });
  var worn = {}, tab = 'top', sizes = {}, qs = new URLSearchParams(location.search);
  // Shareable outfits: build.html?wear=polo-hi-vis-orange,joggers-charcoal  (and ?a=90 to start at an angle)
  // Starts dressed (same outfit as the preview) unless a ?wear= list is given
  (qs.get('wear') !== null ? qs.get('wear') : 'long-sleeve-hi-vis-orange,oilskin-bodywarmer,joggers-hi-vis-orange,bobble-hat-orange,neck-gaiter').split(',').forEach(function (s) { if (G[s] && S.find(s)) worn[G[s].slot] = s; });

  // ---- 3D figure ----
  var fig = $('#fig');
  // The figure is a thick cut-out: each piece is its photo on the front, a darker copy on the back,
  // and a few thin slices between so it has an edge when it turns.
  function slices(src, w, h, left, top, z0, z1, n, b0, b1) {
    var out = '';
    for (var i = 0; i < n; i++) {
      var t = n === 1 ? 1 : i / (n - 1);
      out += '<img src="' + src + '" alt="" draggable="false" style="width:' + w + 'px;height:' + h + 'px;left:' + left + 'px;top:' + top + 'px;transform:translateZ(' + (z0 + (z1 - z0) * t).toFixed(1) + 'px);filter:brightness(' + (b0 + (b1 - b0) * t).toFixed(2) + ')">';
    }
    return out;
  }
  function backFace(src, w, h, left, top, z, br) {
    return '<img class="gb" src="' + src + '" alt="" draggable="false" style="width:' + w + 'px;height:' + h + 'px;left:' + left + 'px;top:' + top + 'px;transform:translateZ(' + z + 'px) rotateY(180deg);filter:brightness(' + br + ')">';
  }
  fig.innerHTML = '<div class="mq-wrap" id="mq"><div class="mq-legs">' + slices('img/build/mannequin-legs.svg', 400, 860, 0, 0, -5, 6, 5, 0.6, 1) + backFace('img/build/mannequin-legs.svg', 400, 860, 0, 0, -6, 0.6) + '</div>' + slices('img/build/mannequin.svg', 400, 860, 0, 0, -5, 6, 5, 0.6, 1) + backFace('img/build/mannequin.svg', 400, 860, 0, 0, -6, 0.6) + '</div><div id="gar"></div>';
  var gar = $('#gar');

  function drawGarments() {
    var html = '';
    Object.keys(worn).forEach(function (slot) {
      var p = S.find(worn[slot]), g = G[p.slug], z = 8 + SLOTS[slot].order * 2;
      var file = BUILD + 'sitespec-' + (S.img(p).split('sitespec-')[1] || '');
      var left = 200 - g.w / 2;
      html += '<div class="gw">' +
        backFace(file, g.w, g.h, left, g.y, -z, 0.55) +
        slices(file, g.w, g.h, left, g.y, z - 9, z, 4, 0.5, 1) + '</div>';
    });
    gar.innerHTML = html;
    $('#mq').classList.toggle('legs-on', !!worn.legs);
  }

  // ---- stage scaling ----
  var box = $('#box'), stage = $('#stage');
  function fit() {
    var w = box.clientWidth, h = box.clientHeight, s = Math.min(w / 400, h / 870) * 0.96;
    stage.style.transform = 'translate(-50%,-50%) scale(' + s.toFixed(4) + ')';
  }
  window.addEventListener('resize', fit); fit();
  if (window.ResizeObserver) new ResizeObserver(fit).observe(box);

  // ---- rotation ----
  var ang = -24, target = null, auto = false, swaying = !window.matchMedia('(prefers-reduced-motion: reduce)').matches, drag = null, t0 = performance.now(), last = t0;
  if (qs.get('a') !== null && !isNaN(+qs.get('a'))) { ang = +qs.get('a'); swaying = false; $('#hint').classList.add('off'); }
  function paint() { fig.style.transform = 'rotateY(' + ang.toFixed(2) + 'deg)'; }
  function norm(a) { a = a % 360; return a < 0 ? a + 360 : a; }
  function setBtn() {
    var a = Math.round(norm(ang));
    [].forEach.call(document.querySelectorAll('.bk-ctl [data-a]'), function (b) { var d = +b.dataset.a; b.classList.toggle('on', Math.min(Math.abs(a - d), 360 - Math.abs(a - d)) < 12); });
  }
  function tick(now) {
    var dt = Math.min(64, now - last); last = now;
    if (!drag) {
      if (target !== null) {
        var d = ((target - ang + 540) % 360) - 180;
        if (Math.abs(d) < 0.4) { ang = target; target = null; } else ang += d * Math.min(1, dt / 120);
      } else if (auto) ang += dt * 0.06;
      else if (swaying) ang = -24 + Math.sin((now - t0) / 900) * 24;
    }
    paint(); setBtn(); requestAnimationFrame(tick);
  }
  function interact() { swaying = false; $('#hint').classList.add('off'); }
  var scene = $('#scene');
  scene.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, a: ang }; swaying = false; target = null; scene.setPointerCapture(e.pointerId); scene.classList.add('grab'); interact(); });
  scene.addEventListener('pointermove', function (e) { if (drag) ang = drag.a + (e.clientX - drag.x) * 0.55; });
  function end() { drag = null; scene.classList.remove('grab'); }
  scene.addEventListener('pointerup', end); scene.addEventListener('pointercancel', end);
  scene.addEventListener('keydown', function (e) { if (e.key === 'ArrowLeft') { ang -= 12; interact(); } if (e.key === 'ArrowRight') { ang += 12; interact(); } });
  scene.tabIndex = 0;
  [].forEach.call(document.querySelectorAll('.bk-ctl [data-a]'), function (b) {
    b.onclick = function () { interact(); auto = false; $('#spinBtn').setAttribute('aria-pressed', 'false'); $('#spinBtn').classList.remove('on'); var d = +b.dataset.a, cur = norm(ang); target = d; ang = cur; };
  });
  $('#spinBtn').onclick = function () { interact(); auto = !auto; target = null; this.setAttribute('aria-pressed', auto); this.classList.toggle('on', auto); };
  $('#clearBtn').onclick = function () { worn = {}; refresh(); };
  requestAnimationFrame(tick);

  // ---- picker ----
  function priceText(p) { return p.price == null ? 'Price coming soon' : S.money(p.price); }
  function renderTabs() {
    $('#tabs').innerHTML = TABS.map(function (k) {
      return '<button type="button" role="tab" aria-selected="' + (k === tab) + '" data-t="' + k + '" class="' + (k === tab ? 'on' : '') + '">' + SLOTS[k].label + (worn[k] ? '<i></i>' : '') + '</button>';
    }).join('');
    [].forEach.call($('#tabs').children, function (b) { b.onclick = function () { tab = b.dataset.t; renderTabs(); renderItems(); }; });
  }
  function renderItems() {
    var list = items.filter(function (p) { return G[p.slug].slot === tab; });
    $('#items').innerHTML = list.map(function (p) {
      var on = worn[tab] === p.slug;
      return '<button type="button" class="bk-it' + (on ? ' on' : '') + '" data-s="' + p.slug + '" aria-pressed="' + on + '"><span class="bk-th"><img src="' + S.img(p) + '" alt="" loading="lazy"></span>' +
        '<span class="bk-nm">' + S.esc(p.name) + '</span><span class="bk-pr">' + priceText(p) + '</span>' + (on ? '<span class="bk-on">On</span>' : '') + '</button>';
    }).join('');
    [].forEach.call($('#items').children, function (b) {
      b.onclick = function () {
        var s = b.dataset.s; if (worn[tab] === s) delete worn[tab]; else worn[tab] = s;
        // a hood or bulky top and a jacket both fit; nothing else conflicts
        refresh();
        if (!drag && target === null && !auto) { interact(); target = 0; }
      };
    });
  }
  function renderSum() {
    var slots = Object.keys(worn).sort(function (a, b) { return SLOTS[a].order - SLOTS[b].order; });
    if (!slots.length) { $('#sum').innerHTML = '<div class="bk-empty"><b>Nothing on yet.</b><span>Pick a top, jacket, joggers or a hat above to dress the mannequin.</span></div>'; return; }
    var total = 0, unpriced = 0, rows = slots.map(function (k) {
      var p = S.find(worn[k]);
      if (p.price == null) unpriced++; else total += p.price;
      var sz = sizes[p.slug] || p.sizes[0];
      var sel = p.sizes.length > 1 ? '<select data-s="' + p.slug + '" aria-label="Size for ' + S.esc(p.name) + '">' + p.sizes.map(function (z) { return '<option' + (z === sz ? ' selected' : '') + '>' + z + '</option>'; }).join('') + '</select>' : '<em>One size</em>';
      return '<li><span class="n">' + S.esc(p.name) + '</span>' + sel + '<span class="p">' + priceText(p) + '</span><button type="button" class="x" data-k="' + k + '" aria-label="Remove ' + S.esc(p.name) + '">&times;</button></li>';
    }).join('');
    var can = slots.some(function (k) { return S.find(worn[k]).price != null; });
    $('#sum').innerHTML = '<h2>Your kit</h2><ul>' + rows + '</ul><div class="bk-tot"><span>Total' + (unpriced ? ' (priced items)' : '') + '</span><b>' + S.money(total) + '</b></div>' +
      (unpriced ? '<p class="bk-pn">' + unpriced + ' piece' + (unpriced > 1 ? 's are' : ' is') + ' not priced yet, so ' + (unpriced > 1 ? 'they' : 'it') + " won't be added to the cart.</p>" : '') +
      '<button type="button" class="btn bk-add" id="addAll"' + (can ? '' : ' disabled') + '>Add kit to cart</button>';
    [].forEach.call($('#sum').querySelectorAll('select'), function (s) { s.onchange = function () { sizes[s.dataset.s] = s.value; }; });
    [].forEach.call($('#sum').querySelectorAll('.x'), function (b) { b.onclick = function () { delete worn[b.dataset.k]; refresh(); }; });
    var a = $('#addAll'); if (a) a.onclick = function () {
      var n = 0; slots.forEach(function (k) { var p = S.find(worn[k]); if (S.addToCart(p.slug, sizes[p.slug] || p.sizes[0], 1)) n++; });
      if (n) S.openCart();
    };
  }
  function refresh() { drawGarments(); renderTabs(); renderItems(); renderSum(); }
  refresh();
});
</script>
</body></html>
