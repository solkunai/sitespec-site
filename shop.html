</head><body>
<a class="skip" href="#main">Skip to content</a>
<div id="site-header"></div>
<main id="main">
<div class="page-head">
<h1 id="title">Shop all</h1>
<div class="pills" id="pills"></div>
</div>
<section class="sec">
<div class="grid4" id="grid"></div>
<div class="empty" id="empty" hidden></div>
</section>
</main>
<div id="site-footer"></div>
<script src="site.js"></script>
<script>
document.addEventListener('sitespec:ready',function(){
var S=window.SITESPEC,q=new URLSearchParams(location.search),cat=q.get('cat'),term=(q.get('q')||'').trim().toLowerCase();
if(!S.CATS[cat])cat=null;
var items=S.PRODUCTS.filter(function(p){
 return (!cat||p.cat===cat)&&(!term||(p.name+' '+S.CATS[p.cat]+' '+(p.colour||'')).toLowerCase().indexOf(term)>-1)});
document.getElementById('title').textContent=term?'Search: '+q.get('q'):(cat?S.CATS[cat]:'Shop all');
document.title=document.getElementById('title').textContent+' | SITESPEC';
var pills=[['','All']].concat(Object.keys(S.CATS).map(function(k){return [k,S.CATS[k]]}));
document.getElementById('pills').innerHTML=pills.map(function(c){return '<a href="shop.html'+(c[0]?'?cat='+c[0]:'')+'"'+((c[0]||null)===cat&&!term?' class="on"':'')+'>'+c[1]+'</a>'}).join('');
document.getElementById('grid').innerHTML=items.map(S.card).join('');
if(!items.length){var e=document.getElementById('empty');e.hidden=false;e.textContent='No products found. Try another search or browse all gear.'}
});
</script>
</body></html>
